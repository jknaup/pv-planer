<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PV-Planer – Browser-Selbsttest</title><style>body{font:16px system-ui;max-width:850px;margin:25px auto;padding:15px}li{padding:7px;margin:5px 0} .ok{color:#187342}.fail{color:#b3261e}iframe{position:absolute;left:-9999px;width:1000px;height:800px}@media(max-width:600px){iframe{width:390px;height:844px}}</style><h1>PV-Planer – Browser-Selbsttest</h1><p>Testet den aktuellen Stand direkt im Browser, ohne Daten an einen Server zu senden.</p><button id="run">Tests erneut ausführen</button><ol id="results"></ol><iframe id="app" src="../index.html" title="Testinstanz"></iframe><script>
const frame=document.getElementById('app'),results=document.getElementById('results');
function check(name,fn){const li=document.createElement('li');try{if(!fn())throw Error('Erwarteter Zustand nicht erreicht');li.textContent='✓ '+name;li.className='ok'}catch(e){li.textContent='✗ '+name+' – '+e.message;li.className='fail'}results.append(li)}
function run(){results.replaceChildren();const w=frame.contentWindow;if(!w||!w.document.getElementById('project'))return;const e=src=>w.eval(src);
check('JavaScript-Anwendung startet',()=>!!w.document.getElementById('summary').textContent);
check('XML v2 exportiert',()=>e('serialize()').includes('<solarProject version="2">'));
const original=e('serialize()');
check('XML-v2-Roundtrip mit zwei Wechselrichtern',()=>{e("inverters.push({id:'test-wr',model:'Test WR',vmax:1000,pmax:'',limits:[limitDefault()]});strings.push({...moduleDefault(),wr:1,mppt:1,count:7,status:'geplant'});renderStrings();calc()");const xml=e('serialize()');e('loadXml('+JSON.stringify(xml)+')');return e("inverters.length===2&&strings.some(s=>s.wr===1&&s.count===7&&s.status==='geplant')")});
check('XML-Import ersetzt Projekt nicht bei Fehler',()=>{const before=e('serialize()');try{e("loadXml('<solarProject><broken></solarProject>')")}catch(_){}return before===e('serialize()')});
check('XML-v1-Migration ohne WR-Feld',()=>{const doc=new DOMParser().parseFromString(original,'application/xml'),root=doc.documentElement;root.querySelector('inverters')?.remove();root.querySelectorAll('string wr').forEach(n=>n.remove());const xml=new XMLSerializer().serializeToString(doc);e('loadXml('+JSON.stringify(xml)+')');return e('inverters.length===1&&strings.every(s=>s.wr===0)')});
check('Alternative Strings beeinflussen die Ausbauleistung nicht',()=>{e("strings=[{...moduleDefault(),count:10,status:'bestand'},{...moduleDefault(),count:100,status:'alternative'}];renderStrings();calc()");return w.document.getElementById('summary').textContent.includes('4,5 kWp')});
check('MPPT-Reduktion korrigiert String-Zuordnung',()=>{e("strings=[{...moduleDefault(),mppt:2}];limits=[limitDefault(),limitDefault()];inverters[0].limits=limits;document.getElementById('mppts').value=1;syncLimits()");return e('strings[0].mppt===1')});
check('Katalog-XML hat Module und Wechselrichter',()=>{e("catalog.modules=[{name:'Test',p:450,voc:41,vmp:34,isc:14,imp:13,bvoc:-.28,bvmp:-.32,bisc:.05}];catalog.inverters=[{model:'Test',vmax:1000,pmax:'',limits:[limitDefault()]}]");const xml=e('catalogXml()');return xml.includes('<modules>')&&xml.includes('<inverters>')});
check('Projektzustand nach Test wiederhergestellt',()=>{e('loadXml('+JSON.stringify(original)+')');return e('inverters.length===1')});
check('1.4 Gesamtplan zeigt zwei Wechselrichter',()=>{e("inverters.push({id:'test-2',model:'Zweiter WR',vmax:1000,pmax:'',limits:[limitDefault()]});strings.push({...moduleDefault(),wr:1,mppt:1,status:'geplant'});calc()");return w.document.getElementById('plantDiagram').textContent.includes('Zweiter WR')&&w.document.querySelectorAll('.plant-card').length===2});
check('1.4 Warnungen in Grafik und Tabelle',()=>{e("strings=[{...moduleDefault(),count:30,wr:0}];calc()");return w.document.getElementById('plantWarnings').textContent.includes('Voc bei Kälte')&&w.document.querySelector('.plant-card.problem')!==null&&w.document.getElementById('plantDiagram').textContent.includes('⚠')});
check('1.4 Alternative löst keine aktive Spannungswarnung aus',()=>{e("strings[0].status='alternative';calc()");return !w.document.getElementById('plantWarnings').textContent.includes('Voc bei Kälte')});
check('1.4 Mobilkarten bei schmalem Bildschirm sichtbar',()=>{return w.matchMedia('(max-width:600px)').matches?w.getComputedStyle(w.document.querySelector('.plant-cards')).display!=='none':true});
check('1.4 Ursprungszustand wiederherstellen',()=>{e('loadXml('+JSON.stringify(original)+')');return e('inverters.length===1')});
check('1.5 Einheitliche Prüfungen und Einstufung',()=>{e("strings=[{...moduleDefault(),count:30,status:'bestand'}];calc()");const wng=e('electricalWarnings()');return wng.perString[0].some(x=>x.level==='critical'&&x.text.includes('Voc bei Kälte'))&&w.document.getElementById('plantWarnings').textContent.includes('critical')&&w.document.getElementById('results').textContent.includes('MPPT')});
check('1.5 Alternative bleibt aus aktiver Prüfung',()=>{e("strings[0].status='alternative';calc()");return e('electricalWarnings().perString[0].length===0')});
check('1.5 Testzustand wiederherstellen',()=>{e('loadXml('+JSON.stringify(original)+')');return e('inverters.length===1')});
check('1.6 MPPT-Reserve zeigt Strom und Spannung',()=>{e("strings=[{...moduleDefault(),count:10,wr:0,mppt:1,status:'bestand'}];calc()");const t=w.document.getElementById('results').textContent;return t.includes('Rechnerische Reserve')&&t.includes('MPP-Spannung')&&t.includes('Kurzschlussstrom')});
check('1.6 Freier MPPT wird angezeigt',()=>{e("strings=[];calc()");return w.document.getElementById('results').textContent.includes('MPPT frei')});
check('1.6 Alternativen verändern Reserve nicht',()=>{e("strings=[{...moduleDefault(),status:'alternative'}];calc()");return w.document.getElementById('results').textContent.includes('MPPT frei')});
check('1.6 Testzustand wiederherstellen',()=>{e('loadXml('+JSON.stringify(original)+')');return e('inverters.length===1')});
check('1.8 MPPT-Kompaktübersicht Desktop und Mobil',()=>{e("strings=[{...moduleDefault(),wr:0,mppt:1,status:'bestand'}];calc()");const o=w.document.getElementById('plantOverview');return o.querySelectorAll('.mppt-summary-row .mppt-pulse-item').length>=2&&o.querySelectorAll('.plant-card .mppt-pulse-item').length>=2&&o.textContent.includes('MPPT 2 · frei')});
check('1.7 Änderungen aktualisieren die MPPT-Auslastung sofort',()=>{const x=w.document.querySelector('#strings [data-k="imp"]');x.value='20';x.dispatchEvent(new w.Event('input',{bubbles:true}));return w.document.getElementById('plantOverview').textContent.includes('20 / 25 A')||w.document.getElementById('plantOverview').textContent.includes('20,00 / 25,00 A')});
check('1.7 String-Warnungen direkt am String',()=>{const x=w.document.querySelector('#strings [data-k="count"]');x.value='35';x.dispatchEvent(new w.Event('input',{bubbles:true}));return w.document.querySelector('#si0').textContent.includes('Voc bei Kälte')});
check('1.8 Alternativen belegen keinen MPPT',()=>{e("strings=[{...moduleDefault(),status:'alternative'}];calc()");return w.document.getElementById('plantOverview').textContent.includes('MPPT 1 · frei')});
check('1.8 Testzustand wiederherstellen',()=>{e('loadXml('+JSON.stringify(original)+')');return e('inverters.length===1')});
check('1.9 Druckbericht enthält Projekt, Wechselrichter und Strings',()=>{e("buildPrintReport()");const t=w.document.getElementById('printReportContent').textContent;return t.includes('PV-Anlagenbericht')&&t.includes('Stringbelegung')&&t.includes('Prüfhinweise')&&t.includes('MPPT')});
check('1.9 Bericht verwendet aktuelle Daten',()=>{e("strings=[{...moduleDefault(),count:17,wr:0,mppt:1,status:'bestand'}];calc();buildPrintReport()");return w.document.getElementById('printReportContent').textContent.includes('17 ×')});
check('1.9 Druckansicht enthält Anlagenplan',()=>{e("buildPrintReport()");return Boolean(w.document.querySelector('#printReportContent .report-diagram svg'))});
check('1.9 Testzustand wiederherstellen',()=>{e('loadXml('+JSON.stringify(original)+')');return e('inverters.length===1')});
const failures=results.querySelectorAll('.fail').length;document.documentElement.dataset.testFailures=String(failures);const p=document.createElement('p');p.textContent=failures?'Fehlgeschlagen: '+failures:'Alle Browser-Selbsttests erfolgreich';p.className=failures?'fail':'ok';results.append(p)}
document.getElementById('run').onclick=run;frame.onload=run;
</script></html>
